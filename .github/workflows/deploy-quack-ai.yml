name: Deploy quack-ai (GitHub Pages)

on:
  push:
    branches: [main, cursor/quack-ai-site-scaffold-f519]
    paths:
      - "quack-ai/**"
      - ".github/workflows/deploy-quack-ai.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-quack-ai
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quack-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: quack-ai/package-lock.json
      - name: Install
        run: npm ci
      - name: Build for GitHub Pages
        env:
          ASTRO_BASE: /fleekelon/
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quack-ai/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
